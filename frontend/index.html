<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AEGIS-COP — Coastal Surveillance &amp; Maritime Intelligence | INDIA</title>
    <meta name="description" content="AEGIS-COP: Tactical Edge Maritime Command &amp; Coastal Surveillance Common Operating Picture for Indian Maritime Sovereignty." />
    <script>
      // Apply the saved theme before first paint (default: dark). Mirrors src/hooks/useTheme.js.
      (function () {
        var pref = 'dark';
        try { pref = localStorage.getItem('aegis-theme') || 'dark'; } catch (e) { /* storage unavailable */ }
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
